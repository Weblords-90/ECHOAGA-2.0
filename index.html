
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10251b">
  <title>ECHOAGA — Your Audio Universe</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/discover.css">
  <link rel="stylesheet" href="css/library.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-theme="basic">

  <main id="app">
    <section id="home" data-screen="home" class="screen active">
      <h1>Home</h1>
    </section>

    <section id="discover" data-screen="discover" class="screen">
      <h1>Discover</h1>
    </section>

    <section id="library" data-screen="library" class="screen">
      <h1>Library</h1>
    </section>

    <section id="profile" data-screen="profile" class="screen">
      <h1>Profile</h1>
    </section>

    <section id="settings" data-screen="settings" class="screen">
      <h1>Settings</h1>
    </section>
  </main>

  <div id="miniPlayer" hidden></div>

  <nav id="bottomNavigation">
    <button data-screen="home">Home</button>
    <button data-screen="discover">Discover</button>
    <button data-screen="library">Library</button>
    <button data-screen="profile">Profile</button>
    <button data-screen="settings">Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>

</html>
